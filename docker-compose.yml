services:
  ros2-gazebo:
    image: ros2-gazebo:jazzy-harmonic
    container_name: ros2-gazebo
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
        GZ_DISTRO: harmonic
        UBUNTU_VERSION: "24.04"
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    hostname: ros2-gazebo
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./workspace:/home/ros/ros2_ws:rw
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility, display]
